name: Temporal

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: temporal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  timeline:
    name: Build PR timeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Assemble the Temporal timeline
        run: npm run temporal:ci

      - name: Add timeline to the workflow summary
        if: always() && hashFiles('temporal-artifact/summary.md') != ''
        run: cat temporal-artifact/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the protected interactive timeline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporal-pr-${{ github.event.pull_request.number }}
          path: temporal-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Link the protected download from a private PR
        if: github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run temporal:comment

  pages:
    name: Publish instant HTML view
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: timeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the trusted publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download the generated timeline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: temporal-pr-${{ github.event.pull_request.number }}
          path: temporal-artifact

      - name: Publish the HTML, wait for Pages, and update the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/temporal-pages.mjs
