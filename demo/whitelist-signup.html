<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join the whitelist</title>
  </head>
  <body>
    <main>
      <h1>Join the whitelist</h1>
      <form>
        <label>Name <input name="name" autocomplete="name" required></label>
        <label>Organization <input name="organization" autocomplete="organization" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Phone number <input name="phone" type="tel" autocomplete="tel"></label>
        <label>Picture of face <input name="profilePhoto" type="file" accept="image/*"></label>
        <button type="submit">Request access</button>
      </form>
    </main>
  </body>
</html>
